<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Library of Odin</title>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="main-container">
      <header class="header">
        <div class="header-container">
          <h1 class="heading">Library of Odin</h1>
          <p class="subtext">Place where one finds knowledge of immortals.</p>
        </div>
      </header>
      <section class="shelf">
        <div class="shelf-header">
          <h2 class="shelf-heading">My Shelf</h2>
          <button class="add-book-btn">+ Add Book</button>
        </div>
        <div class="cards">
          <article class="card">
            <div class="outermost-wrapper">
              <div class="wrapper">
                <div class="title">The Hobbit</div>
                <div class="author">J.R.R. Tolkien</div>
                <div class="pages">
                  <span class="pages-text">Pages:</span>
                  <span class="page-count">295</span>
                </div>
              </div>
              <div class="status status-read">Read</div>
            </div>
            <div class="buttons">
              <button class="status-btn">Mark Unread</button>
              <button class="remove-btn">Remove</button>
            </div>
          </article>
          <article class="card">
            <div class="outermost-wrapper">
              <div class="wrapper">
                <div class="title">The Hobbit</div>
                <div class="author">J.R.R. Tolkien</div>
                <div class="pages">
                  <span class="pages-text">Pages:</span>
                  <span class="page-count">295</span>
                </div>
              </div>
              <div class="status status-read">Read</div>
            </div>
            <div class="buttons">
              <button class="status-btn">Mark Unread</button>
              <button class="remove-btn">Remove</button>
            </div>
          </article>
          <article class="card">
            <div class="outermost-wrapper">
              <div class="wrapper">
                <div class="title">The Hobbit</div>
                <div class="author">J.R.R. Tolkien</div>
                <div class="pages">
                  <span class="pages-text">Pages:</span>
                  <span class="page-count">295</span>
                </div>
              </div>
              <div class="status status-read">Read</div>
            </div>
            <div class="buttons">
              <button class="status-btn">Mark Unread</button>
              <button class="remove-btn">Remove</button>
            </div>
          </article>
          <article class="card">
            <div class="outermost-wrapper">
              <div class="wrapper">
                <div class="title">The Tenant</div>
                <div class="author">Frieda McFadden</div>
                <div class="pages">
                  <span class="pages-text">Pages:</span>
                  <span class="page-count">295</span>
                </div>
              </div>
              <div class="status status-unread">Unread</div>
            </div>
            <div class="buttons">
              <button class="status-btn">Mark Unread</button>
              <button class="remove-btn">Remove</button>
            </div>
          </article>
        </div>
      </section>
    </div>
    <dialog class="dialog">
      <form action="#">
        <h2>Add a new book</h2>
        <div>
          <label for="title">Enter Title:</label>
          <input type="text" id="title" name="title" />
        </div>
        <div>
          <label for="author">Enter Author:</label>
          <input type="text" id="author" name="author" />
        </div>
        <div>
          <label for="pages">Enter Pages:</label>
          <input type="number" id="pages" name="pages" />
        </div>
        <div class="checkbox">
          <input type="checkbox" id="status" name="status" />
          <label for="status">Mark as read</label>
        </div>
        <div class="buttons">
          <button type="button" class="cancel">Cancel</button>
          <button type="submit" class="submit">Submit</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
